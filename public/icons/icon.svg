<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0f291e" />
      <stop offset="65%" stop-color="#080d14" />
      <stop offset="100%" stop-color="#05070b" />
    </radialGradient>
    <linearGradient id="bioRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="corePulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="55%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </radialGradient>
  </defs>
  <!-- Tactical Void Base -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)" />
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#1e293b" stroke-width="6" />
  <!-- Outer Containment Octagon / Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#bioRing)" stroke-width="14" stroke-dasharray="48 18" />
  <circle cx="256" cy="256" r="138" fill="none" stroke="#22c55e" stroke-opacity="0.35" stroke-width="4" />
  <!-- Parasitic Spore Tendrils -->
  <g stroke="#4ade80" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="80" x2="256" y2="145" />
    <line x1="256" y1="367" x2="256" y2="432" />
    <line x1="80" y1="256" x2="145" y2="256" />
    <line x1="367" y1="256" x2="432" y2="256" />
    <line x1="132" y1="132" x2="178" y2="178" />
    <line x1="334" y1="334" x2="380" y2="380" />
    <line x1="380" y1="132" x2="334" y2="178" />
    <line x1="178" y1="334" x2="132" y2="380" />
  </g>
  <!-- Central Biomass Spire Core -->
  <polygon points="256,146 351,201 351,311 256,366 161,311 161,201" fill="#09131c" stroke="#4ade80" stroke-width="10" />
  <circle cx="256" cy="256" r="54" fill="url(#corePulse)" />
  <circle cx="240" cy="238" r="14" fill="#dcfce7" fill-opacity="0.85" />
  <!-- RP Hazard Accent Nodes -->
  <circle cx="256" cy="80" r="12" fill="#f59e0b" />
  <circle cx="256" cy="432" r="12" fill="#f59e0b" />
  <circle cx="80" cy="256" r="12" fill="#38bdf8" />
  <circle cx="432" cy="256" r="12" fill="#38bdf8" />
</svg>

