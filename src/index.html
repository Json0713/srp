<!doctype html>
<html lang="en" style="background-color: #05070b; color-scheme: dark;">
<head>
  <meta charset="utf-8">
  <title>Project Parasite | Outbreak Protocol</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Project Parasite (SRP) — Offline top-down 2.5D pixel-art survival roguelite inspired by Scape and Run: Parasites and Magic Survival.">
  <meta name="application-name" content="Project Parasite">
  <meta name="theme-color" content="#06080c">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Project Parasite">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body {
      background-color: #05070b !important;
      color: #e6edf3;
      margin: 0;
      padding: 0;
      color-scheme: dark;
    }
    .app-boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      background: radial-gradient(circle at 50% 45%, #0c2218 0%, #06080c 70%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      z-index: 9999;
    }
    .app-boot-splash img {
      width: 84px;
      height: 84px;
      filter: drop-shadow(0 0 18px rgba(34, 197, 94, 0.45));
      animation: srpPulse 1.8s ease-in-out infinite;
    }
    .app-boot-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #4ade80;
    }
    .app-boot-sub {
      font-family: ui-monospace, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      color: #94a3b8;
    }
    @keyframes srpPulse {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.06); opacity: 1; }
    }
  </style>
</head>
<body style="background-color: #05070b; color-scheme: dark;">
  <app-root>
    <div class="app-boot-splash" role="status" aria-label="Loading Project Parasite">
      <img src="icons/icon.svg" alt="Project Parasite Emblem" width="84" height="84" />
      <div class="app-boot-title">PROJECT PARASITE</div>
      <div class="app-boot-sub">INITIALIZING CONTAINMENT PROTOCOL...</div>
    </div>
  </app-root>
  <noscript>Please enable JavaScript to run Project Parasite | Outbreak Protocol.</noscript>
</body>
</html>
